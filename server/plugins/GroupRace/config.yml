# ============================================================
# 群友竞速赛（GroupRace）配置文件
# 修改后：在非对局状态执行 /race reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
min-players: 2
max-players: 16

# ---------- 对局 ----------
# 一局时长（秒）
game-seconds: 300
# 超过一半玩家到达终点后，剩余时间缩短到多少秒
finish-short-seconds: 20

# ---------- 飞猪 ----------
pig:
  # 自动前进速度（格/tick，约 0.5-0.8）
  speed: 0.45
  # 惯性：0 = 立即转向，0.9 = 很滑；越大越难急转
  inertia: 0.9
  # 按住跳跃键上升速度（格/tick）
  ascend-speed: 0.35
  # 按住下蹲键下降速度（格/tick）
  descend-speed: 0.35
  # 多名玩家在起点横向散开的间距（格）
  start-spread: 0

# ---------- 圆环 ----------
ring:
  # 圆环半径（格）；方块会围成一圈，中间是穿过用的洞
  radius: 3.0
  # 普通圆环方块材质
  material: SEA_LANTERN
  # 终点圆环方块材质
  finish-material: REDSTONE_BLOCK

# ---------- 场地 ----------
# 用指令设置，不要手写坐标：
#   /race setlobby | /race setstart | /race pos1 | /race pos2
#   /race addring | /race addfinish | /race save
