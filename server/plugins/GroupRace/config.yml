  pos1: 'tpl:mini_games,-283.1351,27.7288,27.2234,178.0,28.9'
  pos2: 'tpl:mini_games,-247.1164,35.9732,-221.3594,29.2,59.8'
  lobby: 'tpl:mini_games,-267.4779,16,24.3883,179.1,-2.4'
  start: 'tpl:mini_games,-267.379,16,16.81,-179.7,-3.1'

