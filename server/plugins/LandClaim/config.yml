# 等待人数
min-players: 2
# 最多 16 人（插件只有 16 种羊毛颜色）
max-players: 16
# 单局时长（秒）。0 = 不限时；时间到按占地格数结算
game-seconds: 120
# 锄头每次能把脚下多少格范围内的自己的羊毛作为“领地”延伸依据
claim-radius: 1
# 场地地面方块
floor-block: GRASS_BLOCK
# 生成场地时，地面以上清空多少格
clear-height: 3

# 场地（OP 用 /land setcenter、/land setradius、/land generate 设置，再 /land save）
arena:
  world: 'tpl:mini_games'
  # 圆形场地中心（用 /land setcenter 设置）
  center: tpl:mini_games,20.00,-14.00,-207.00,0.00,0.00
  # 半径（格）
  radius: 10
  # 等待点（不设则使用第一个出生点）
  lobby: tpl:mini_games,20.43,-13.00,-206.45,-90.17,-5.25
  # 出生点列表（/land addspawn 或 /land genspawns 自动生成）
  spawns:
  - tpl:mini_games,28.50,-13.00,-206.50,90.00,0.00
  - tpl:mini_games,26.16,-13.00,-200.84,45.00,0.00
  - tpl:mini_games,20.50,-13.00,-198.50,0.00,0.00
  - tpl:mini_games,14.84,-13.00,-200.84,-45.00,0.00
  - tpl:mini_games,12.50,-13.00,-206.50,-90.00,0.00
  - tpl:mini_games,14.84,-13.00,-212.16,-135.00,0.00
  - tpl:mini_games,20.50,-13.00,-214.50,-180.00,0.00
  - tpl:mini_games,26.16,-13.00,-212.16,-225.00,0.00

wait-items:
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
    - '&7点击立刻开始本局'
  leave:
    material: RED_BED
    name: '&c&l退出房间 &7(右键)'
    lore:
    - '&7点击离开等待室'
countdown:
  enabled: true
  seconds: 3
  freeze: false
  title: '&e游戏即将开始：{time}'
  subtitle: '&7准备好'

