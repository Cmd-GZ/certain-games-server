# ============================================================
# One Shot 配置文件
# 修改后在非对局状态执行 /oneshot reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 最多人数
max-players: 16

# ---------- 对局 ----------
# 一局最长时长（秒）；时间到仍有多人存活则一起获胜
game-seconds: 120
# 被击杀后多久内摔死仍算最后攻击者的人头（秒）
kill-credit-seconds: 10

# ---------- 对局道具 ----------
items:
  sword:
    material: WOODEN_SWORD
    name: '&6&l木剑 &7(无限耐久)'
    lore:
    - '&7砍死对手可以补回一支箭'
  bow:
    material: BOW
    name: '&a&l弓 &7(无限耐久)'
    lore:
    - '&7射中玩家直接秒杀'
    - '&7箭用掉后击杀任意玩家可补回'
  arrow:
    material: ARROW
    name: '&e&l箭 &7(只有一支)'

# ---------- 等待室道具 ----------
wait-items:
  return:
    material: RED_BED
    name: '&a&l返回大厅 &7(右键)'
    lore:
    - '&7点击返回大厅'
    slot: 8
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
    - '&7点击立刻开始本局'
    slot: 4

# ---------- 右侧计分板 ----------
sidebar:
  enabled: true
  title: '&c&lOne Shot · 存活'

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；/oneshot build 会自动建台并生成出生点
arena:
  # 场地中心（台面中心；/oneshot build 会自动写入）
  center: tpl:mini_games,265.50,71.00,602.50,76.1,22.4
  # 圆形场地半径（格）
  radius: 6
  # 台面比执行建场指令时站立的方块高几格（0 = 与脚下齐平）
  height: 3
  # 台面下方再铺几层石头（底座厚度）
  depth: 3
  # 台面方块 / 底座方块
  platform-material: STONE
  base-material: STONE
  # 离开台面后，掉到台面以下这么多格判定为摔死（击杀算最后打你的人）
  fall-kill-below: 1.5
  # 手动建场：自己搭好场地后，站到两个对角执行 /oneshot pos1、/oneshot pos2
  # 只取 XZ 范围；Y 轴自动扫描矩形内最低/最高的非空气方块（立体地图整块选中）
  # 低于最低点、或走出 XZ 范围即判定摔死
  pos1: tpl:mini_games,304.45,112.00,642.27,150.0,20.6
  pos2: tpl:mini_games,203.48,114.00,566.54,-23.1,64.8
  # 等待点（/oneshot setlobby 写）
  lobby: tpl:mini_games,260.49,74.50,648.93,178.8,-2.7
  # 出生点（/oneshot build 自动生成；也可 /oneshot genspawns 重新生成）
  spawns:
  - tpl:mini_games,275.50,95.00,605.50,0.0,0.0
  - tpl:mini_games,278.50,92.00,597.50,0.0,0.0
  - tpl:mini_games,294.50,75.00,614.50,0.0,0.0
  - tpl:mini_games,221.50,77.00,588.50,0.0,0.0
  - tpl:mini_games,238.50,88.00,599.50,0.0,0.0
  - tpl:mini_games,259.50,92.00,596.50,0.0,0.0
  - tpl:mini_games,260.50,83.00,585.50,0.0,0.0
  - tpl:mini_games,223.50,95.00,608.50,0.0,0.0
  - tpl:mini_games,243.50,89.00,624.50,0.0,0.0
  - tpl:mini_games,220.50,72.00,580.50,0.0,0.0
  - tpl:mini_games,248.50,89.00,614.50,0.0,0.0
  - tpl:mini_games,285.50,85.00,615.50,0.0,0.0
  - tpl:mini_games,262.50,90.00,620.50,0.0,0.0
  - tpl:mini_games,221.50,74.00,623.50,0.0,0.0
  - tpl:mini_games,267.50,86.00,624.50,0.0,0.0
  - tpl:mini_games,266.50,88.00,622.50,0.0,0.0
  box-min-y: 38
  box-max-y: 113
countdown:
  enabled: true
  seconds: 3
  freeze: false
  title: '&e游戏即将开始：{time}'
  subtitle: '&7准备好'


