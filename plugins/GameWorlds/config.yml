# ================= GameWorlds 多世界配置 =================
# 启动时自动创建/加载以下世界，并套用各自的规则（每次启动都会重新套用，确保与配置一致）。
# 已存在的世界文件夹会直接加载（不重建，type/environment 仅用于首次生成）。
#
# 字段说明：
#   enabled         是否管理该世界（false 则跳过）
#   environment     NORMAL / NETHER / THE_END
#   type            首次生成时的地形：FLAT（超平坦）/ NORMAL（普通地形）/ VOID（虚空）
#   fixed-time      固定时间（0=午夜 6000=白天 12000=黄昏 18000=夜晚；-1=不固定随自然流逝）
#   difficulty      PEACEFUL / EASY / NORMAL / HARD
#   pvp             是否允许玩家互相伤害（单挑世界必须 true，其他建议 false 防误伤）
#   mob-spawning    是否生成怪物（小游戏世界建议 false）
#   weather-cycle   是否随时间变化天气（建议 false，固定晴天）
#   fire-spread     火是否蔓延（TNT Run / 建筑世界建议 false）
#   mob-griefing    苦力怕/末影人等是否破坏地形（建议 false）
#   keep-inventory  死亡保留背包（幸运之柱必须 false，见下）
#
# ===== 2026-11-03「世界/地图重排」之后的布局 =====
#
# 旧的持久小游戏世界**全部退役**（world_mini_game / world_mm / world_duel / world_gtb /
# world_tr / world_tnt / world_hp / world_lp / world_pvp_mini_games / world_fb / world_wf /
# 0Void World / persmap / 0BB-Candyland / 0MM-SantaFactory）。
# 地图改成「模板世界 → 房间世界」：模板只登记、**不自动加载**（D19），
# 房间由 `/gw create room <模板>`（或 `/hub create <游戏> <地图>`）按需复制一份。
# 模板名单见 MiniGameLib 的 templates.yml，地图→模板/区域/规则见 maps.yml。
#
# 主城（Bukkit 世界名 `world`，维度目录 overworld）**不模板化**（D1），不在这里管。
# world_htf 暂时保留：HoldTheFort 是 git submodule，还没接模板世界。

worlds:
  # ---------- 模板世界：只登记、不自动加载 ----------
  # 这里写的是「模板默认规则」；房间真正套用的是 maps.yml 里那张地图的 rules。
  tmpl_mini_games:
    enabled: true
    environment: NORMAL
    type: VOID
    fixed-time: 6000
    difficulty: NORMAL
    pvp: false
    mob-spawning: false
    weather-cycle: false
