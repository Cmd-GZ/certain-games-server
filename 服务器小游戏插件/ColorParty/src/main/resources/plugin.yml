name: ColorParty
version: '1.8.0'
main: com.colorparty.ColorPartyPlugin
api-version: '1.21'
description: 色盲派对：地板每回合随机彩色混凝土，站上指定颜色，站错塌陷淘汰
minigame:
  key: colorparty          # 游戏 key（与 maps.yml / games.yml / players.yml 一致）
  name: 色盲派对
  icon: MAGENTA_CONCRETE
  color: d
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]
commands:
  colorparty:
    description: 色盲派对
    usage: /cp help
    aliases: [cp]
permissions:
  cp.use:
    default: true
  cp.admin:
    default: op
