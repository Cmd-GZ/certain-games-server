name: MemoryFlip
version: '1.11.0'
main: com.memoryflip.MemoryFlipPlugin
api-version: '1.21'
description: 记忆翻牌：翻开物品展示框配对，最快翻完获胜
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

minigame-game: true
minigame:
  key: memoryflip          # 游戏 key（与 maps.yml / games.yml / players.yml 一致）
  contract: 1                                    # 框架契约版本（MiniGameLib 的 Contract.VERSION）
  name: 记忆翻牌
  icon: FILLED_MAP
  color: 'b'

commands:
  memory:
    description: 记忆翻牌小游戏
    usage: /memory help
    aliases: [mem, memoryflip, flip]

permissions:
  memory.use:
    default: true
  memory.admin:
    default: op
