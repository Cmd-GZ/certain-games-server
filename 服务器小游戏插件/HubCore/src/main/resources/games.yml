# ================= 统一控制面：每个游戏的命令映射 =================
#
# 用途：/hub start <房间> / /hub stop <房间> 需要知道"怎么让某个游戏开一局/停一局"，
#       但每个游戏的命令名和参数都不一样（/hill start、/tntrun start {arena} …）。
#       这里把映射集中到一处，运维只需要记一套 /hub 命令。
#
# {arena} 会被替换成房间对应的场地名（暂时留空；房间↔场地绑定是 R5 的事）。
#
# 为什么先这么做（而不是给每个游戏定义接口）：
#   真正统一需要一个 GameControl 接口，那是 25 次改造；配置转发的语义已经够用，
#   而且上线即可用。等游戏逐个迁到接口后，这里退化成兼容层。
#
# 缺某一项时的行为：
#   缺 join-command  -> 房间里的玩家不会被拉进游戏，只发 start/stop（多数游戏自己会拉人）
#   缺 start-command -> /hub start 明确报错并提示在这里补一行
#   缺 stop-command  -> /hub stop 报错（有些游戏没有 stop，用 /hub room delete 也能收场）

games:
  hillking:      { join-command: "hill join",        start-command: "hill start",        stop-command: "hill stop" }
  murdermystery: { join-command: "mm join",          start-command: "mm start" }
  digtobottom:   { join-command: "dig join {arena}", start-command: "dig start {arena}" }
  anvilbattle:   { join-command: "anvil join",       start-command: "anvil start" }
  animalslaughter: { join-command: "animal join",    start-command: "animal start" }
  snakeparty:    { join-command: "snake join",       start-command: "snake start" }
  hotpotato:     { join-command: "hotpotato join {arena}", start-command: "hotpotato start {arena}" }
  tntrun:        { join-command: "tntrun join {arena}",    start-command: "tntrun start {arena}" }
  colorparty:    { join-command: "colorparty join {arena}", start-command: "colorparty start {arena}" }
  grouprace:     { join-command: "race join",        start-command: "race start" }
  knockback:     { join-command: "knockback join",   start-command: "knockback start" }
  landclaim:     { join-command: "land join",        start-command: "land start" }
  jumpfill:      { join-command: "jump join",        start-command: "jump start" }
  memoryflip:    { join-command: "memory join",      start-command: "memory start" }
  oneshot:       { join-command: "oneshot join",     start-command: "oneshot start" }
